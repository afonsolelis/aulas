[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tcg-dataapp"
version = "0.4.0"
description = "DataApp of Lesson 6 as a package, instrumented for Prometheus: TCGplayer prices from extraction to the gold layer, with metrics of every run"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4,<3",
    "py7zr>=0.22",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tcg-dataapp = "tcg_dataapp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tcg_dataapp.processors" = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
