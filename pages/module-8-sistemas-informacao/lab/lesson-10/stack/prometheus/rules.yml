# Lesson 10 · recording and alerting rules of the DataApp.
# Check with: promtool check rules rules.yml
groups:
  # The recording rules come first, in the same group as the alerts that read them:
  # the rules of one group are evaluated in order, so TcgPricesStale reads the
  # freshness of the same evaluation. In separate groups the order is not fixed,
  # and the alert could read the value of the previous minute.
  - name: tcg_dataapp
    rules:
      # Seconds since the newest price was captured. Written once, reused by the
      # dashboard and by the alert below. The prices of today are stored at noon
      # UTC, which is in the future for a run in the morning, so the age is
      # clamped at zero instead of going negative.
      - record: tcg:price_freshness_seconds
        expr: clamp_min(time() - tcg_ingestion_last_timestamp_seconds{data_tag="tcgplayer.price.v1"}, 0)
      # 95th percentile of the requests to tcgcsv.com in the last pushed run, by endpoint.
      # The histogram of a pushed run holds only that run, so there is no rate() here.
      - record: tcg:source_request_duration_seconds:p95
        expr: histogram_quantile(0.95, sum by (le, endpoint) (tcg_source_request_duration_seconds_bucket{job="tcg_dataapp"}))

      - alert: TcgRunFailed
        expr: tcg_run_success{job="tcg_dataapp"} == 0
        labels:
          severity: critical
        annotations:
          summary: "The last run of tcg-dataapp on {{ $labels.instance }} failed"
          # The alert carries the trace of the run: tcg_run_info has the trace_id as a label.
          description: >-
            {{ with query "tcg_run_info{job='tcg_dataapp'}" }}{{ with first . }}Run {{ .Labels.run_id }}, trace {{ .Labels.trace_id }}: open it in Tempo, then the log lines of the failing span in Loki.{{ end }}{{ end }}

      - alert: TcgNoSuccessfulRun
        # the run is scheduled daily; two hours of tolerance
        expr: time() - tcg_run_last_success_timestamp_seconds{job="tcg_dataapp"} > 26 * 3600
        labels:
          severity: critical
        annotations:
          summary: "No successful run of tcg-dataapp for more than 26 hours"

      - alert: TcgRunTooSlow
        # the reference run takes about 40 s; three times that is a symptom
        expr: tcg_run_duration_seconds{job="tcg_dataapp"} > 120
        labels:
          severity: warning
        annotations:
          summary: "The last run took {{ $value | humanizeDuration }}"

      - alert: TcgPricesStale
        expr: tcg:price_freshness_seconds > 36 * 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The newest price in db_ingestion is {{ $value | humanizeDuration }} old"

      - alert: TcgGrainBroken
        expr: tcg_gold_fact_rows != tcg_gold_fact_grain_keys
        labels:
          severity: critical
        annotations:
          summary: "gold.fact_price has more rows than keys of its grain"

      - alert: TcgExporterDown
        expr: up{job="tcg_exporter"} == 0 or tcg_warehouse_readable == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus cannot read the state of the warehouse"

  # Lesson 10 · the closed loop. These alerts are the human part of the loop:
  # they fire only when the controller cannot correct the DataApp on its own.
  - name: tcg_controller_alerts
    rules:
      - alert: TcgControllerEscalated
        expr: tcg_controller_escalated{job="tcg_controller"} == 1
        labels:
          severity: critical
        annotations:
          summary: "The controller of tcg-dataapp handed the loop to a person"
          description: "ops.controller_state has the reason; tcg-dataapp control --acknowledge clears it after the fix."

      - alert: TcgControllerBreakerOpenTooLong
        expr: max_over_time(tcg_controller_breaker_open{job="tcg_controller"}[2h]) == 1 and tcg_controller_breaker_open{job="tcg_controller"} == 1
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "The circuit breaker on tcgcsv.com has been open for two hours"

      - alert: TcgControllerSilent
        # the loop itself can stop; nobody would notice without this rule
        expr: time() - tcg_controller_last_tick_timestamp_seconds{job="tcg_controller"} > 3 * 300
        labels:
          severity: warning
        annotations:
          summary: "The controller has not ticked for {{ $value | humanizeDuration }}"
