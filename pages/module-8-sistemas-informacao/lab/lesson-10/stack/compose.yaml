# Lesson 10 · the monitoring stack of the DataApp: Prometheus, Pushgateway and Grafana.
#   docker compose up -d        Prometheus :9090 · Pushgateway :9091 · Grafana :3000
#   docker compose down -v      stops and removes everything
# The DataApp itself runs on the host: `tcg-dataapp run --push localhost:9091`
# and `tcg-dataapp metrics` (port 9108), which Prometheus reaches as host.docker.internal.
name: tcg-telemetry

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle          # POST /-/reload rereads prometheus.yml and rules.yml
    ports: ["9090:9090"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    extra_hosts: ["host.docker.internal:host-gateway"]

  pushgateway:
    image: prom/pushgateway:v1.11.2
    ports: ["9091:9091"]

  grafana:
    image: grafana/grafana:13.2.4
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # the class reads the dashboard without logging in
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tcg_dataapp.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  prometheus-data:
