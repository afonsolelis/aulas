# Lesson 10 · the observability stack of the DataApp: the three signals and the loop.
#
#   metrics  the run pushes to the Pushgateway, the exporter is scraped  → Prometheus
#   traces   the run sends OTLP to the collector                         → Tempo
#   logs     the run sends OTLP to the collector (and writes JSON lines) → Loki
#   Grafana reads the three and links them: metric → trace → log line.
#
#   docker compose up -d       Prometheus :9090 · Pushgateway :9091 · collector :4318 ·
#                              Tempo :3200 · Loki :3100 · Grafana :3000 (GRAFANA_PORT)
#   docker compose down -v     stops and removes everything
#
# The DataApp runs on the host:
#   TCG_OTLP_ENDPOINT=http://localhost:4318 TCG_PUSHGATEWAY=localhost:9091 tcg-dataapp run --with-today
#   tcg-dataapp metrics                      (exporter, port 9108)
#   tcg-dataapp control --interval 60        (the closed loop)
name: tcg-observability

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports: ["9090:9090"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    extra_hosts: ["host.docker.internal:host-gateway"]

  pushgateway:
    image: prom/pushgateway:v1.11.2
    ports: ["9091:9091"]

  # One entry point for traces and logs: the DataApp knows only this address,
  # and the collector decides where each signal goes.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.141.0
    command: ["--config=/etc/otelcol/config.yaml"]
    ports: ["4317:4317", "4318:4318"]
    volumes:
      - ./otel/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [tempo, loki]

  tempo:
    image: grafana/tempo:2.10.10
    user: "0"                       # writes its blocks to the named volume
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports: ["3200:3200"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:3.6.3       # default config: single binary, OTLP at /otlp/v1/logs
    ports: ["3100:3100"]

  grafana:
    image: grafana/grafana:13.2.4
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"        # lets the class open Explore to follow a trace
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tcg_dataapp.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, tempo, loki]

volumes:
  prometheus-data:
  tempo-data:
