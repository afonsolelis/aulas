# Theme of the Streamlit app in the palette of the Inteli design system.
# Streamlit reads this file from the folder where the app is started,
# so run `tcg-dataapp app` from the folder of the project.

[theme]
base = "light"
primaryColor = "#2f8f78"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#e6eaeb"
textColor = "#2e2640"
linkColor = "#2e2640"
borderColor = "#caced6"
showWidgetBorder = true
baseRadius = "0.25rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
chartCategoricalColors = ["#2f8f78", "#2e2640", "#b2b6bf"]

[server]
runOnSave = false

[browser]
gatherUsageStats = false
