# Local MinIO for Lesson 4 (ETL: Object Storage to Data Warehouse).
# The official MinIO image is no longer published; this image is built by
# coolLabs from the official releases.
# Credentials come from .env (copy .env.example to .env and change the password).
services:
  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: minio_lesson4
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"   # S3-compatible API (DuckDB httpfs, boto3, mc)
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  minio_data:
