# Lesson 5 · Hybrid Silver layer: a long-lived lake in the MinIO, read with DuckDB,
# and a short-lived copy in ClickHouse for tactical queries.
# Credentials come from .env (copy .env.example to .env and change the passwords).
#
#   docker compose up -d --wait      # both services healthy
#   docker compose exec clickhouse clickhouse-client --user "$CLICKHOUSE_USER" --password "$CLICKHOUSE_PASSWORD"
#   docker compose down              # keeps the volumes
#   docker compose down -v           # also deletes the lake and the ClickHouse data
services:
  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: minio_lesson5
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"   # S3-compatible API (DuckDB httpfs, boto3)
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.15.10
    container_name: clickhouse_lesson5
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-silver}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"   # HTTP interface (clickhouse-connect, curl)
    # The native port 9000 is not published: the MinIO already uses 9000 on the host.
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  minio_data:
  clickhouse_data:
