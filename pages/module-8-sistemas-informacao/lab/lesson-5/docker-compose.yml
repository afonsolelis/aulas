# Lesson 5 · Hybrid Silver layer of the Olist case: a long-lived lake in RustFS (S3 API), read with DuckDB,
# and a short-lived copy in ClickHouse for tactical queries and the star model.
# Credentials come from .env (copy .env.example to .env and change the passwords).
#
#   docker compose up -d --wait      # both services healthy
#   docker compose exec clickhouse sh -c 'clickhouse-client --user "$CLICKHOUSE_USER" --password "$CLICKHOUSE_PASSWORD"'
#   docker compose down              # keeps the volumes
#   docker compose down -v           # also deletes the lake and the ClickHouse data
services:
  rustfs:
    image: rustfs/rustfs:1.0.4
    container_name: rustfs_lesson5
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      RUSTFS_ADDRESS: ":9000"            # S3 API
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"    # web console at /rustfs/console/
    ports:
      - "9000:9000"   # S3-compatible API (DuckDB httpfs, boto3)
      - "9001:9001"   # console: http://localhost:9001/rustfs/console/
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.15.10
    container_name: clickhouse_lesson5
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-silver}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"   # HTTP interface (clickhouse-connect, curl)
    # The native port 9000 is not published: RustFS already uses 9000 on the host.
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  rustfs_data:
  clickhouse_data:
