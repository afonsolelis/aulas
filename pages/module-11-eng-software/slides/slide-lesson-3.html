<style>
  /* Layout terminal: o deck gerado (.lesson-slide + .lesson-footer), que a camada .tm-deck de css/inteli-ds.css não alcança */
  .tm-deck .lesson-slides *, .tm-deck .lesson-footer * { border-radius:0 !important; box-shadow:none !important; }
  .tm-deck .lesson-slide { background:var(--ds-fundo); }
  .tm-deck .lesson-kicker { font-family:var(--ds-fonte-mono); font-weight:500; letter-spacing:.06em; color:var(--ds-texto-suave); }
  .tm-deck .lesson-slide h2 { font-family:var(--ds-fonte-mono); font-weight:600; letter-spacing:-.02em; color:var(--ds-texto-forte); }
  .tm-deck .lesson-cover { background:var(--ds-fundo); color:var(--ds-texto-forte); }
  .tm-deck .lesson-cover .lesson-kicker { display:inline-flex; align-items:center; gap:8px; align-self:flex-start; padding:4px 10px; border:1px solid var(--ds-texto-forte); color:var(--ds-texto-forte); }
  .tm-deck .lesson-cover .lesson-kicker::before { content:""; width:8px; height:8px; flex:none; background:var(--ds-curso); }
  .tm-deck .lesson-cover h1 { font-family:var(--ds-fonte-mono); font-weight:500; letter-spacing:-.03em; color:var(--ds-texto-forte); }
  .tm-deck .lesson-cover p { color:var(--ds-texto); }
  .tm-deck .lesson-cover small { font-family:var(--ds-fonte-mono); color:var(--ds-texto-suave); }
  .tm-deck .lesson-card, .tm-deck .mermaid-wrap { background:var(--ds-fundo); border:1px solid var(--ds-borda-forte); }
  .tm-deck .lesson-card b { font-family:var(--ds-fonte-mono); font-weight:500; letter-spacing:.06em; color:var(--ds-texto-suave); }
  .tm-deck .lesson-card h3, .tm-deck .lesson-card strong { color:var(--ds-texto-forte); }
  .tm-deck .lesson-card p, .tm-deck .lesson-card li { color:var(--ds-texto); }
  .tm-deck .lesson-hint { font-family:var(--ds-fonte-mono); font-weight:500 !important; color:var(--ds-texto-suave) !important; }
  .tm-deck .lesson-callout { background:var(--ds-fundo-fraco); border:1px solid var(--ds-borda); border-left:2px solid var(--ds-texto-forte); color:var(--ds-texto-forte); }
  .tm-deck .lesson-warn { background:var(--ds-fundo); border:1px solid var(--ds-borda-forte); border-left:2px solid var(--inteli-coral); color:var(--ds-texto-forte); }
  .tm-deck .lesson-warn strong, .tm-deck .lesson-warn li { color:var(--ds-coral-texto); }
  .tm-deck .lesson-code { border:1px solid var(--ds-texto-forte); }
  .tm-deck .lesson-card code, .tm-deck .lesson-callout code { background:var(--ds-fundo-fraco); color:var(--ds-texto-forte); }
  .tm-deck .receipt-table { border-color:var(--ds-borda-forte); }
  .tm-deck .receipt-table thead th { color:var(--ds-texto-forte); font-weight:600; border-bottom:2px solid var(--ds-texto-forte); }
  .tm-deck .receipt-table tfoot td { color:var(--ds-texto-forte); }
  .tm-deck .encontro-meta { background:var(--ds-fundo); border:1px solid var(--ds-texto-forte); }
  .tm-deck .encontro-meta > h2 { font-family:var(--ds-fonte-mono); }
  .tm-deck .encontro-meta .encontro-ref { font-family:var(--ds-fonte-mono); }
  .tm-deck .encontro-item h3 { font-family:var(--ds-fonte-mono); font-weight:500; color:var(--ds-texto-suave); }
  .tm-deck .lesson-footer { background:var(--ds-fundo); border-top:1px solid var(--ds-borda-forte); }
  .tm-deck .lesson-footer button, .tm-deck .lesson-footer a { font-family:var(--ds-fonte-mono); font-weight:500; }
  .tm-deck .lesson-footer button { background:var(--ds-texto-forte); color:var(--ds-texto-inverso); border:1px solid var(--ds-texto-forte); }
  .tm-deck .lesson-footer button:disabled { background:var(--ds-fundo); color:var(--ds-texto-fraco); border-color:var(--ds-borda); cursor:default; }
  .tm-deck .lesson-footer a { background:var(--ds-fundo); color:var(--ds-texto-forte); border:1px solid var(--ds-borda-forte); }
  .tm-deck .lesson-footer a:hover { background:var(--ds-fundo-fraco); }
  .tm-deck .lesson-footer a:last-child { background:var(--ds-verde-escuro); border-color:var(--ds-verde-escuro); color:var(--ds-texto-inverso); }
  .tm-deck .lesson-counter { font-family:var(--ds-fonte-mono); font-weight:500; color:var(--ds-texto-forte); }
</style>
<style>
  /* Mermaid usa a classe .label nos rótulos do diagrama; a camada .tm-deck a trata como etiqueta (mono, contorno, quadrado). */

  .tm-deck .mermaid .label::before { content:none; }
</style>

<body data-lesson="3" class="lesson-deck tm-deck ds-curso-eng-software">
  <main id="lesson-slides" class="lesson-slides"></main>
  <footer class="lesson-footer">
    <a href="../../home-module-11-eng-software.html">🏠 Módulo 11</a>
    <button id="prev">← Anterior</button>
    <span id="counter" class="lesson-counter">1 / 1</span>
    <button id="next">Próximo →</button>
    <a href="../materials/lesson-3-material.html">📖 Material</a>
  </footer>
  <script src="../lesson-content.js"></script>
  <script>
    const root = document.getElementById('lesson-slides');
    const total = window.renderLessonSlides(root);
    let current = 0;
    const items = [...root.children];
    const counter = document.getElementById('counter');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    function show(index) {
      current = Math.max(0, Math.min(index, total - 1));
      items.forEach((item, i) => item.classList.toggle('active', i === current));
      counter.textContent = (current + 1) + ' / ' + total;
      prev.disabled = current === 0;
      next.disabled = current === total - 1;
    }
    prev.addEventListener('click', () => show(current - 1));
    next.addEventListener('click', () => show(current + 1));
    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft') show(current - 1);
      if (event.key === 'ArrowRight' || event.key === ' ') { event.preventDefault(); show(current + 1); }
    });
    show(0);
  </script>
