  <link href="../../../css/inteli-styles.css" rel="stylesheet">

  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      themeVariables: {
        fontFamily: 'Manrope, sans-serif',
        fontSize: '30px',
        primaryColor: '#fee2e2',
        primaryTextColor: '#1e293b',
        primaryBorderColor: '#dc2626',
        lineColor: '#4b5563',
        secondaryColor: '#dbeafe',
        tertiaryColor: '#dcfce7'
      },
      er: { useMaxWidth: true, layoutDirection: 'LR' },
      flowchart: { useMaxWidth: true }
    });
    window.mermaid = mermaid;
    if (typeof window.renderSlideMermaid === 'function') {
      var active = document.querySelector('.lesson-slide.active');
      if (active) window.renderSlideMermaid(active);
    }
  </script>

<body data-lesson="4" class="lesson-deck">
  <main id="lesson-slides" class="lesson-slides"></main>
  <footer class="lesson-footer">
    <a href="../../home-module-11-eng-software.html">🏠 Módulo 11</a>
    <button id="prev">← Anterior</button>
    <span id="counter" class="lesson-counter">1 / 1</span>
    <button id="next">Próximo →</button>
    <a href="../materials/lesson-4-material.html">📖 Material</a>
  </footer>
  <script src="../lesson-content.js"></script>
  <script>
    const root = document.getElementById('lesson-slides');
    const total = window.renderLessonSlides(root);
    let current = 0;
    const items = [...root.children];
    const counter = document.getElementById('counter');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');

    // Mermaid — preserva o source de cada bloco e renderiza só quando o slide fica ativo,
    // já que um bloco dentro de um slide oculto (display:none) mede largura zero.
    document.querySelectorAll('.mermaid').forEach((el) => {
      if (!el.hasAttribute('data-src')) el.setAttribute('data-src', el.textContent.trim());
    });
    function renderSlideMermaid(slide) {
      if (!window.mermaid) return;
      const blocks = slide.querySelectorAll('.mermaid');
      if (!blocks.length) return;
      const toRender = [];
      blocks.forEach((b) => {
        const hasSvg = !!b.querySelector('svg');
        const hasErr = /Syntax error/i.test(b.innerHTML);
        if (hasSvg && !hasErr) return;
        const src = b.getAttribute('data-src') || '';
        if (!src) return;
        b.innerHTML = src;
        b.removeAttribute('data-processed');
        toRender.push(b);
      });
      if (toRender.length) {
        try { window.mermaid.run({ nodes: toRender }); } catch (e) { console.warn('mermaid render', e); }
      }
    }
    window.renderSlideMermaid = renderSlideMermaid;

    function show(index) {
      current = Math.max(0, Math.min(index, total - 1));
      items.forEach((item, i) => item.classList.toggle('active', i === current));
      counter.textContent = (current + 1) + ' / ' + total;
      prev.disabled = current === 0;
      next.disabled = current === total - 1;
      renderSlideMermaid(items[current]);
    }
    prev.addEventListener('click', () => show(current - 1));
    next.addEventListener('click', () => show(current + 1));
    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft') show(current - 1);
      if (event.key === 'ArrowRight' || event.key === ' ') { event.preventDefault(); show(current + 1); }
    });
    show(0);
  </script>
