<style>
  /* Layout terminal: corpo do plano gerado (.plan-body) e blocos de aprofundamento, que a camada .tm-material não alcança */
  .tm-material .plan-body section { background:var(--ds-fundo); border:1px solid var(--ds-borda-forte); }
  .tm-material .plan-body h2 { font-family:var(--ds-fonte-mono); font-weight:600; letter-spacing:-.02em; color:var(--ds-texto-forte); border-bottom:1px solid var(--ds-texto-forte); }
  .tm-material .plan-body :is(h3, h4, strong, b) { color:var(--ds-texto-forte); }
  .tm-material .material-note { background:var(--ds-fundo-fraco); border:1px solid var(--ds-borda); border-left:2px solid var(--ds-texto-forte); color:var(--ds-texto-forte); }
  .tm-material :is(.dd-steps li, .dd-fields div, .dd-split > div, .dd-num li, .dd-releases li) { background:var(--ds-fundo) !important; border:1px solid var(--ds-borda-forte) !important; }
  .tm-material :is(.dd-steps b, .dd-fields dt) { font-family:var(--ds-fonte-mono); font-weight:500; color:var(--ds-texto-suave); }
  .tm-material .dd-num li::before { font-family:var(--ds-fonte-mono); font-weight:500; color:var(--ds-texto-suave); }
  .tm-material .dd-table thead th { background:var(--ds-fundo); color:var(--ds-texto-forte); }
  .tm-material .dd-table tbody th { background:var(--ds-fundo-fraco); color:var(--ds-texto-forte); }
  .tm-material .dd-table td.bad { background:none; color:var(--ds-coral-texto); }
  .tm-material .dd-table td.good { background:none; color:var(--ds-verde-texto); }
  .tm-material .dd-table.matrix td.on { background:none; color:var(--ds-texto-forte); }
  .tm-material .dd-prio { background:none; border:1px solid var(--ds-texto-forte); color:var(--ds-texto-forte); font-family:var(--ds-fonte-mono); font-weight:500; }
  .tm-material .dd-ok h4 { color:var(--ds-verde-texto); }
  .tm-material .dd-bad h4 { color:var(--ds-coral-texto); }
  .tm-material .dd-releases em { background:none; border:1px solid var(--ds-borda-forte); color:var(--ds-texto-forte); font-family:var(--ds-fonte-mono); font-weight:500; }
  .tm-material .dd-closing { border-left:2px solid var(--ds-texto-forte) !important; }
  .tm-material :is(.sql-engine, .sql-actions button) { font-family:var(--ds-fonte-mono); font-weight:500; }
</style>
