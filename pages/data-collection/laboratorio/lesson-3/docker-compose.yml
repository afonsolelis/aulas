# MinIO local para desenvolvimento da Aula 03 (mesmo serviço usado na Aula 02).
# A imagem oficial deixou de ser publicada; usamos a imagem da coolLabs,
# construída a partir das releases oficiais e usada pelo template do Railway.
# Credenciais vêm do arquivo .env (copie .env.example para .env e troque a senha).
services:
  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: minio_aula03
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}
    ports:
      - "9000:9000"   # API compatível com S3 (boto3, mc)
      - "9001:9001"   # console web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  minio_data:
