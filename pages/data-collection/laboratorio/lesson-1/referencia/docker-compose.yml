# MinIO local para desenvolvimento (Aula 01 - Data Collection and Storage)
#
# Mesma imagem e mesma tag do serviço publicado no Railway (ADR-001).
# Uso:
#   cp .env.example .env          # e troque a senha
#   docker compose up -d
#   docker compose ps             # STATUS deve chegar a "healthy"
#   docker compose down           # para; os dados ficam no volume minio_data
#   docker compose down -v        # para e APAGA o volume (perde os objetos)
name: minio_local

services:
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"   # API compatível com S3
      - "9001:9001"   # console web
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no arquivo .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no arquivo .env}
    volumes:
      - minio_data:/data
    healthcheck:
      # A imagem não traz curl nem wget; o cliente mc já vem instalado.
      # "mc ready local" consulta o endpoint de saúde em http://localhost:9000.
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  minio_data:
