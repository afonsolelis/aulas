# MinIO local da Aula 02 (Data Collection and Storage, Inteli)
#
# Uso, a partir desta pasta:
#   cp .env.example .env        # troque a senha antes de subir
#   docker compose up -d
#   docker compose ps            # minio deve ficar "healthy"; minio-init sai com código 0
#
# Porta 9000: API compatível com S3 (boto3, mc, DuckDB).
# Porta 9001: console web (no Codespace, abra pela aba PORTS).
#
# A imagem é a mantida pela coolLabs, construída a partir das releases oficiais
# do MinIO e usada pelo template de MinIO do Railway. A tag fica fixa de propósito.

services:
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_dados:/data
    healthcheck:
      # A imagem não traz curl; o bash testa se a porta da API aceita conexão.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Cria o bucket raw uma vez. Pode rodar de novo sem erro (--ignore-existing).
  minio-init:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BUCKET_RAW: ${BUCKET_RAW:-raw}
    entrypoint: ["bash", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$BUCKET_RAW" &&
        mc ls local
    restart: "no"

volumes:
  minio_dados:
