<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480" role="img"
     aria-labelledby="valTitle valDesc">
  <title id="valTitle">Val da Caxirola, personagem em estilo boneco colecionável</title>
  <desc id="valDesc">Ilustração de um homem negro de barba curta e cabelo baixo, desenhado como boneco de cabeça grande e corpo pequeno, com camiseta amarela e uma caxirola de madeira na mão direita.</desc>

  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%"  stop-color="#fdf3e0"/>
      <stop offset="100%" stop-color="#f0e2c8"/>
    </radialGradient>
    <radialGradient id="pele" cx="38%" cy="30%" r="78%">
      <stop offset="0%"  stop-color="#a9714a"/>
      <stop offset="62%" stop-color="#8d5a3b"/>
      <stop offset="100%" stop-color="#6e452c"/>
    </radialGradient>
    <radialGradient id="cabelo" cx="36%" cy="24%" r="76%">
      <stop offset="0%"  stop-color="#332620"/>
      <stop offset="100%" stop-color="#150f0c"/>
    </radialGradient>
    <linearGradient id="camisa" x1="20%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%"  stop-color="#ffc24d"/>
      <stop offset="55%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#cf8412"/>
    </linearGradient>
    <linearGradient id="calca" x1="25%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%"  stop-color="#3b6390"/>
      <stop offset="100%" stop-color="#24405e"/>
    </linearGradient>
    <radialGradient id="caxi" cx="34%" cy="26%" r="80%">
      <stop offset="0%"  stop-color="#d9a55e"/>
      <stop offset="58%" stop-color="#b5763a"/>
      <stop offset="100%" stop-color="#7e4e21"/>
    </radialGradient>
    <radialGradient id="olho" cx="34%" cy="28%" r="70%">
      <stop offset="0%"  stop-color="#4a3a33"/>
      <stop offset="100%" stop-color="#120c0a"/>
    </radialGradient>
    <radialGradient id="sombra" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="rgba(90,60,30,0.34)"/>
      <stop offset="100%" stop-color="rgba(90,60,30,0)"/>
    </radialGradient>
  </defs>

  <rect width="400" height="480" rx="28" fill="url(#bg)"/>
  <ellipse cx="200" cy="442" rx="118" ry="24" fill="url(#sombra)"/>

  <!-- pernas e sapatos -->
  <g>
    <rect x="160" y="372" width="34" height="56" rx="15" fill="url(#calca)"/>
    <rect x="206" y="372" width="34" height="56" rx="15" fill="url(#calca)"/>
    <ellipse cx="177" cy="432" rx="26" ry="14" fill="#f7f4ee"/>
    <ellipse cx="223" cy="432" rx="26" ry="14" fill="#f7f4ee"/>
    <path d="M151 434a26 14 0 0 0 52 0z" fill="#ddd6ca"/>
    <path d="M197 434a26 14 0 0 0 52 0z" fill="#ddd6ca"/>
  </g>

  <!-- torso -->
  <path d="M143 262h114a22 22 0 0 1 22 22v76a22 22 0 0 1-22 22H143a22 22 0 0 1-22-22v-76a22 22 0 0 1 22-22z"
        fill="url(#camisa)"/>
  <!-- gola -->
  <path d="M168 262h64l-12 20a26 26 0 0 1-40 0z" fill="#e0940f"/>
  <!-- estampa: onda sonora -->
  <g stroke="#7a4a05" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <line x1="163" y1="322" x2="163" y2="334"/>
    <line x1="177" y1="312" x2="177" y2="344"/>
    <line x1="191" y1="302" x2="191" y2="354"/>
    <line x1="205" y1="314" x2="205" y2="342"/>
    <line x1="219" y1="306" x2="219" y2="350"/>
    <line x1="233" y1="320" x2="233" y2="336"/>
  </g>

  <!-- braço esquerdo (do observador) -->
  <path d="M133 276a20 20 0 0 1 20 20v44a20 20 0 0 1-40 0v-44a20 20 0 0 1 20-20z" fill="url(#camisa)"/>
  <circle cx="133" cy="356" r="19" fill="url(#pele)"/>
  <!-- braço direito erguido, segurando a caxirola -->
  <path d="M267 276a20 20 0 0 1 20 20v30a20 20 0 0 1-40 0v-30a20 20 0 0 1 20-20z" fill="url(#camisa)"/>
  <circle cx="287" cy="330" r="19" fill="url(#pele)"/>

  <!-- caxirola -->
  <g transform="translate(287 300) rotate(14)">
    <path d="M0-46c19 0 32 16 32 34 0 20-14 34-32 34s-32-14-32-34c0-18 13-34 32-34z" fill="url(#caxi)"/>
    <path d="M0-46c-19 0-32 16-32 34 0 8 2 15 7 21 4-22 13-40 25-55z" fill="#e2b473" opacity="0.5"/>
    <g stroke="#6f4419" stroke-width="2.4" opacity="0.55" fill="none">
      <path d="M-27-6h54"/><path d="M-30 6h60"/><path d="M-26 18h52"/>
    </g>
    <rect x="-9" y="-56" width="18" height="16" rx="7" fill="#8a5a28"/>
  </g>

  <!-- cabeça -->
  <ellipse cx="200" cy="176" rx="104" ry="96" fill="url(#pele)"/>
  <!-- orelhas -->
  <ellipse cx="98"  cy="182" rx="15" ry="20" fill="#7b4d31"/>
  <ellipse cx="302" cy="182" rx="15" ry="20" fill="#7b4d31"/>
  <!-- cabelo -->
  <path d="M200 76c62 0 104 40 104 84 0 6-1 12-3 17-6-38-33-58-70-62-14-2-28-2-42 0-37 4-64 24-70 62-2-5-3-11-3-17 0-44 42-84 84-84z"
        fill="url(#cabelo)"/>
  <path d="M116 168c8-34 36-52 84-52s76 18 84 52c-10-16-28-26-50-30-23-4-45-4-68 0-22 4-40 14-50 30z"
        fill="#241a15" opacity="0.65"/>
  <!-- sobrancelhas -->
  <path d="M142 158c12-9 30-9 41-1" stroke="#1a1310" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M217 157c11-8 29-8 41 1" stroke="#1a1310" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- olhos -->
  <ellipse cx="162" cy="188" rx="19" ry="21" fill="url(#olho)"/>
  <ellipse cx="238" cy="188" rx="19" ry="21" fill="url(#olho)"/>
  <circle cx="155" cy="180" r="6.5" fill="#fff" opacity="0.92"/>
  <circle cx="231" cy="180" r="6.5" fill="#fff" opacity="0.92"/>
  <circle cx="168" cy="196" r="3"   fill="#fff" opacity="0.5"/>
  <circle cx="244" cy="196" r="3"   fill="#fff" opacity="0.5"/>
  <!-- nariz -->
  <path d="M200 205c7 0 11 6 11 11s-5 8-11 8-11-2-11-8 4-11 11-11z" fill="#7a4c30" opacity="0.75"/>
  <!-- sorriso -->
  <path d="M172 236c16 16 40 16 56 0" stroke="#4a2c1b" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- barba curta -->
  <path d="M132 206c4 40 32 66 68 66s64-26 68-66c4 30-6 56-26 70-13 9-27 13-42 13s-29-4-42-13c-20-14-30-40-26-70z"
        fill="#1d1511" opacity="0.5"/>
</svg>
