name: CI/CD - Test & Deploy to Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Só leitura no nível do workflow. As permissões de escrita ficam no job
# deploy, o único que publica no Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # --ignore-scripts barra os lifecycle scripts das dependências; os
      # browsers vêm do passo seguinte, pelo binário que o lockfile fixou,
      # em vez de npx, que buscaria o pacote na rede.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Publica só o que o site efetivamente serve. Deixa de fora node_modules,
      # .git, .aiox-core, tests/ e docs internas (materiais/, module_guidelines/)
      # que não são linkadas por nenhuma página.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html index.json _site/
          cp -r pages css js config _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
